name: Publish to npm

# Auto-publish when the version in package.json changes on master.
# Flow: bump "version" in package.json, commit, push -> this builds,
# typechecks, tests, and publishes ONLY if that version isn't on npm yet.
#
# Auth: npm trusted publishing (OIDC) — no NPM_TOKEN. Requires a trusted
# publisher to be configured for this package on npmjs.com pointing at
# udah1/cursor-chat-bridge + this workflow file (publish.yml).
# Provenance is generated automatically for OIDC publishes from public repos.
on:
  push:
    branches: [master]
    paths: ["package.json"]
  workflow_dispatch: {}

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to push the release tag
      id-token: write # required for OIDC trusted publishing
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false # never cache in release builds

      # Trusted publishing needs npm >= 11.5.1 (newer than what Node bundles).
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Check if version is already published
        id: check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "already published: $NAME@$VERSION"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "new version to publish: $NAME@$VERSION"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish (OIDC)
        if: steps.check.outputs.publish == 'true'
        run: npm publish --access public

      - name: Tag the release
        if: steps.check.outputs.publish == 'true'
        run: |
          git tag "v${{ steps.check.outputs.version }}"
          git push origin "v${{ steps.check.outputs.version }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Keep the Official MCP Registry (io.github.udah1/cursor-chat-bridge) in lockstep with npm.
      # It propagates onward to Glama / PulseMCP / VS Code, so skipping this is what makes the
      # ecosystem listings drift behind npm. Auth is the same OIDC identity as the npm publish —
      # no secrets. Runs after tagging so a registry hiccup can't block the git tag.
      - name: Publish to the Official MCP Registry
        if: steps.check.outputs.publish == 'true'
        run: |
          set -euo pipefail
          VERSION="${{ steps.check.outputs.version }}"
          NAME=$(node -p "require('./package.json').name")

          curl -sSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher

          # server.json is a template; stamp the version we just shipped so it always matches npm.
          node -e '
            const fs = require("fs");
            const v = process.argv[1];
            const s = JSON.parse(fs.readFileSync("server.json", "utf8"));
            s.version = v;
            s.packages = (s.packages || []).map((p) => ({ ...p, version: v }));
            fs.writeFileSync("server.json", JSON.stringify(s, null, 2) + "\n");
          ' "$VERSION"

          # The registry validates against the npm tarball; give the CDN a moment to serve it.
          for _ in $(seq 1 10); do
            npm view "$NAME@$VERSION" version >/dev/null 2>&1 && break
            sleep 6
          done

          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
